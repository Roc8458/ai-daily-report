# AI Daily Report — 每日早报云端自动化
# 触发：UTC 00:00（北京时间 08:00）· GitHub 定时有 ±10~30 分钟漂移属正常
# 手动触发：仓库 Actions 页 → AI Daily Report → Run workflow（可勾选"仅测试，不发邮件"）
name: AI Daily Report

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = Asia/Shanghai 08:00
  workflow_dispatch:
    inputs:
      no_send:
        description: "仅测试（生成日报但不发邮件）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -q requests feedparser markdown

      - name: Run pipeline (fetch → skeleton → LLM enhance → send)
        env:
          # LLM（小米 MiMo，OpenAI 兼容接口）
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.xiaomimimo.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'mimo-v2.5' }}
          # SMTP 邮箱（QQ 等，授权码非登录密码）
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          if [ "${{ inputs.no_send }}" = "true" ]; then
            python scripts/run_daily.py --no-send
          else
            python scripts/run_daily.py
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ github.run_id }}
          path: reports/*.md
          retention-days: 14
